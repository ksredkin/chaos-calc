[project]
name = "chaos-calc"
version = "0.1.0"
description = ""
authors = [
    {name = "ksredkin",email = "ksredkin0968@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
]


[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["venv", "versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = 3.14
ignore_missing_imports = true
disallow_untyped_defs = true
strict = true
mypy_path = "."
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=src/api --cov-config=pyproject.toml --cov-report=term-missing"

[tool.coverage.run]
source = ["src/api"]

[tool.coverage.report]
show_missing = true
omit = ["**/__init__.py", "tests/*", "src/api/__main__.py"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.15,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-coverage (>=0.0,<0.1)",
    "fakeredis (>=2.36.0,<3.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "aiosqlite (>=0.20.0,<0.25.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "httpx2 (>=2.3.0,<3.0.0)"
]
